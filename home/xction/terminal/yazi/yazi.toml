[opener]

edit = [
    { run = 'nvim %s', block = true, desc = "Neovim" }
]

image = [
    { run = 'imv %s', desc = "imv", orphan = true },
    { run = 'gwenview %s', desc = "Gwenview", orphan = true },
]

video = [
    { run = 'mpv %s', desc = "mpv", orphan = true },
    { run = 'vlc %s', desc = "vlc", orphan = true },
]

pdf = [
    { run = 'zathura %s', desc = "Zathura", orphan = true },
    { run = 'librewolf %s', desc = "Browser", orphan = true },
]

[open]
rules = [
    { mime = "image/*", use = "image" },
    { mime = "video/*", use = "video" },
    { mime = "application/pdf", use = "pdf" },
    { mime = "*/*", use = "edit" },
]