# version: 1.0.0
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
continuation_prompt = "[▸▹ ](dimmed #7aa2f7)"

format = """
($nix_shell$container$fill$git_metrics\n)\
$cmd_duration\
$directory\
$git_branch\
$git_status\
$python\
$rust\
$package\
$username\
$sudo\
$character
"""

right_format = """
$hostname\
$localip\
$shell\
$shlvl\
$c\
$cpp\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$maven\
$nim\
$nodejs\
$bun\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$raku\
$rlang\
$red\
$ruby\
$scala\
$solidity\
$swift\
$terraform\
$vlang\
$vagrant\
$xmake\
$zig\
$buf\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$crystal\
$custom\
$status\
$os\
$battery\
$time
"""

[fill]
symbol = ' '

[character]
format = "$symbol "
success_symbol = "[◎](bold italic #7dcfff)"
error_symbol = "[○](italic #bb9af7)"
vimcmd_symbol = "[■](italic dimmed #7aa2f7)"
vimcmd_replace_one_symbol = "◌"
vimcmd_replace_symbol = "□"
vimcmd_visual_symbol = "▼"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = '#7dcfff italic'

[sudo]
format = "[$symbol]($style)"
style = "bold italic #bb9af7"
symbol = "⋈┈"
disabled = false

[username]
style_user = "bold italic #89ddff"
style_root = "bold italic #bb9af7"
format = "[⭘ $user]($style) "
disabled = false
show_always = true

[directory]
home_symbol = "⌂"
truncation_length = 3
truncation_symbol = "□ "
fish_style_pwd_dir_length = 1
use_os_path_sep = true
style = "italic #82aaff"
format = "[$path]($style)[$read_only]($read_only_style)"
read_only = " ◈"
read_only_style = "bold #bb9af7"
repo_root_style = "bold #7dcfff"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) [△](bold #89ddff)"

[cmd_duration]
format = "[◄ $duration ](italic #a9b1d6)"

[jobs]
format = "[$symbol$number]($style) "
style = "#7aa2f7"
symbol = "[▶](#7dcfff italic)"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold #bb9af7)"
disabled = false

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed #a9b1d6"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold #7dcfff)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold #bb9af7"

[[battery.display]]
threshold = 60
style = "italic dimmed #7aa2f7"

[[battery.display]]
threshold = 70
style = "italic dimmed #89ddff"

[git_branch]
format = " [$symbol $branch]($style)"
symbol = "△"
style = "italic #7dcfff"
truncation_length = 20
truncation_symbol = "⋯"
only_attached = true

[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic dimmed #7dcfff'
deleted_style = 'italic dimmed #bb9af7'
ignore_submodules = true
disabled = false

[git_status]
style = "bold italic #82aaff"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"
conflicted = "[◪◦](italic #bb9af7)"
ahead = "[▴│[${count}](bold #c0caf5)│](italic #7dcfff)"
behind = "[▿│[${count}](bold #c0caf5)│](italic #82aaff)"
diverged = "[◇ ▴┤[${ahead_count}](regular #c0caf5)│▿┤[${behind_count}](regular #c0caf5)│](italic #bb9af7)"
untracked = "[◌◦](italic #89ddff)"
stashed = "[◃◈](italic #a9b1d6)"
modified = "[●◦](italic #7aa2f7)"
staged = "[▪┤[$count](bold #c0caf5)│](italic #89ddff)"
renamed = "[◎◦](italic #7dcfff)"
deleted = "[✕](italic #bb9af7)"

[deno]
format = " [deno](italic) [∫ $version](#7dcfff bold)"
version_format = "${raw}"

[lua]
format = " [lua](italic) [${symbol}${version}]($style)"
version_format = "${raw}"
symbol = "⨀ "
style = "bold #89ddff"

[nodejs]
format = " [node](italic) [◫ ($version)](bold #7dcfff)"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []

[bun]
format = " [bun](italic) [◫ ($version)](bold #7dcfff)"
version_format = "${raw}"

[python]
format = " [py](italic) [${symbol}${version}]($style)"
symbol = "[⌉](bold #82aaff)⌊ "
version_format = "${raw}"
style = "bold #89ddff"

[ruby]
format = " [rb](italic) [${symbol}${version}]($style)"
symbol = "◆ "
version_format = "${raw}"
style = "bold #bb9af7"

[rust]
format = " [rs](italic) [$symbol$version]($style)"
symbol = "⊃ "
version_format = "${raw}"
style = "bold #7dcfff"

[package]
format = " [pkg](italic dimmed) [$symbol$version]($style)"
version_format = "${raw}"
symbol = "◨ "
style = "dimmed #89ddff italic bold"

[swift]
format = " [sw](italic) [${symbol}${version}]($style)"
symbol = "◁ "
style = "bold #82aaff"
version_format = "${raw}"

[aws]
disabled = true
format = " [aws](italic) [$symbol $profile $region]($style)"
style = "bold #7aa2f7"
symbol = "▲ "

[buf]
symbol = "■ "
format = " [buf](italic) [$symbol $version $buf_version]($style)"

[c]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[cpp]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[conda]
symbol = "◯ "
format = " conda [$symbol$environment]($style)"

[pixi]
symbol = "■ "
format = " pixi [$symbol$version ($environment )]($style)"

[dart]
symbol = "◁◅ "
format = " dart [$symbol($version )]($style)"

[docker_context]
symbol = "◧ "
format = " docker [$symbol$context]($style)"

[elixir]
symbol = "△ "
format = " exs [$symbol $version OTP $otp_version ]($style)"

[elm]
symbol = "◩ "
format = " elm [$symbol($version )]($style)"

[golang]
symbol = "∩ "
format = " go [$symbol($version )]($style)"

[haskell]
symbol = "❯λ "
format = " hs [$symbol($version )]($style)"

[java]
symbol = "∪ "
format = " java [${symbol}(${version} )]($style)"

[julia]
symbol = "◎ "
format = " jl [$symbol($version )]($style)"

[memory_usage]
symbol = "▪▫▪ "
format = " mem [${ram}( ${swap})]($style)"

[nim]
symbol = "▴▲▴ "
format = " nim [$symbol($version )]($style)"

[nix_shell]
style = "bold italic dimmed #7aa2f7"
symbol = "✶"
format = "[$symbol nix⎪$state⎪]($style) [$name](italic dimmed #c0caf5)"
impure_msg = "[⌽](bold dimmed #bb9af7)"
pure_msg = "[⌾](bold #7dcfff)"
unknown_msg = "[◌](bold #89ddff)"

[spack]
symbol = "◇ "
format = " spack [$symbol$environment]($style)"